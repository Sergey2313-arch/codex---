<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TodoList Pro</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app" aria-labelledby="title">
      <header class="app__header">
        <h1 id="title">TodoList Pro</h1>
        <p class="app__subtitle">Быстрый список задач с фильтрами, поиском и сохранением.</p>
      </header>

      <section class="panel panel--create" aria-label="Добавление задач">
        <form id="todo-form" class="create-form">
          <label for="todo-input" class="sr-only">Новая задача</label>
          <input id="todo-input" type="text" maxlength="120" placeholder="Что нужно сделать?" autocomplete="off" required />
          <button type="submit">Добавить</button>
        </form>
      </section>

      <section class="panel panel--tools" aria-label="Инструменты">
        <div class="tools-row">
          <input id="search-input" type="search" placeholder="Поиск по задачам" aria-label="Поиск по задачам" />
          <select id="sort-select" aria-label="Сортировка задач">
            <option value="new">Сначала новые</option>
            <option value="old">Сначала старые</option>
            <option value="az">По алфавиту А-Я</option>
            <option value="za">По алфавиту Я-А</option>
          </select>
        </div>
        <div class="tools-row tools-row--filters" role="tablist" aria-label="Фильтр задач">
          <button class="chip is-active" type="button" data-filter="all" role="tab" aria-selected="true">Все</button>
          <button class="chip" type="button" data-filter="active" role="tab" aria-selected="false">Активные</button>
          <button class="chip" type="button" data-filter="done" role="tab" aria-selected="false">Выполненные</button>
        </div>
      </section>

      <section class="panel panel--list" aria-label="Список задач">
        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
        <p id="todo-empty" class="empty-state">Ничего не найдено. Добавьте первую задачу ✨</p>
      </section>

      <footer class="panel panel--footer" aria-label="Управление списком">
        <div id="stats" class="stats"></div>
        <div class="actions">
          <button id="toggle-all" type="button" class="btn-secondary">Переключить все</button>
          <button id="clear-completed" type="button" class="btn-danger">Удалить выполненные</button>
        </div>
      </footer>
    </main>

    <template id="todo-item-template">
      <li class="todo-item">
        <label class="todo-main">
          <input class="todo-checkbox" type="checkbox" />
          <span class="todo-text"></span>
        </label>
        <div class="todo-actions">
          <button type="button" class="icon-btn edit-btn" aria-label="Редактировать">✎</button>
          <button type="button" class="icon-btn remove-btn" aria-label="Удалить">✕</button>
        </div>
      </li>
    </template>

    <script src="app.js"></script>
  </body>
</html>
